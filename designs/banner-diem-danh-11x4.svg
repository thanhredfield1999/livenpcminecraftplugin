<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="512" viewBox="0 0 1408 512">
  <defs>
    <pattern id="stone" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#121315"/>
      <rect width="32" height="32" fill="#151719"/>
      <rect x="32" y="32" width="32" height="32" fill="#0e1011"/>
      <path d="M0 32H64M32 0V32M16 32V64" stroke="#1b1d1f" stroke-width="2" opacity=".75"/>
    </pattern>
    <pattern id="ticks" width="32" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="7" width="4" height="2" fill="#72551a"/>
    </pattern>
    <filter id="hardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feFlood flood-color="#4d370e" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in" result="shadow"/>
      <feOffset dx="6" dy="7" in="shadow" result="offset"/>
      <feMerge><feMergeNode in="offset"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1408" height="512" fill="#08090a"/>
  <rect x="8" y="8" width="1392" height="496" fill="#3a3c3d"/>
  <rect x="16" y="16" width="1376" height="480" fill="#17191a"/>
  <rect x="24" y="24" width="1360" height="464" fill="#8d6b1f"/>
  <rect x="30" y="30" width="1348" height="452" fill="#33270e"/>
  <rect x="38" y="38" width="1332" height="436" fill="url(#stone)"/>
  <rect x="54" y="54" width="1300" height="404" fill="none" stroke="#242729" stroke-width="4"/>
  <rect x="60" y="60" width="1288" height="392" fill="url(#ticks)" opacity=".4"/>

  <!-- Các đinh tán và góc khóa tạo cảm giác bảng được ghép bằng block. -->
  <g fill="#d7aa2e">
    <path d="M38 38h54v8H54v46h-8V54h-8z"/><path d="M1370 38h-54v8h38v46h8V54h8z"/>
    <path d="M38 474h54v-8H54v-46h-8v38h-8z"/><path d="M1370 474h-54v-8h38v-46h8v38h8z"/>
  </g>
  <g fill="#f4d35e">
    <rect x="66" y="66" width="10" height="10"/><rect x="1332" y="66" width="10" height="10"/>
    <rect x="66" y="436" width="10" height="10"/><rect x="1332" y="436" width="10" height="10"/>
  </g>

  <!-- Đồng xu tối giản hai bên là tín hiệu phần thưởng. -->
  <g transform="translate(142 126)">
    <rect x="18" y="0" width="48" height="8" fill="#8d6b1f"/><rect x="8" y="8" width="68" height="8" fill="#d7aa2e"/>
    <rect x="0" y="16" width="84" height="52" fill="#d7aa2e"/><rect x="8" y="24" width="68" height="36" fill="#f4d35e"/>
    <rect x="18" y="32" width="48" height="20" fill="#b88920"/><rect x="30" y="24" width="24" height="36" fill="#e5bc3d"/>
    <rect x="8" y="68" width="68" height="8" fill="#8d6b1f"/><rect x="18" y="76" width="48" height="8" fill="#4d370e"/>
  </g>
  <g transform="translate(1182 126)">
    <rect x="18" y="0" width="48" height="8" fill="#8d6b1f"/><rect x="8" y="8" width="68" height="8" fill="#d7aa2e"/>
    <rect x="0" y="16" width="84" height="52" fill="#d7aa2e"/><rect x="8" y="24" width="68" height="36" fill="#f4d35e"/>
    <rect x="18" y="32" width="48" height="20" fill="#b88920"/><rect x="30" y="24" width="24" height="36" fill="#e5bc3d"/>
    <rect x="8" y="68" width="68" height="8" fill="#8d6b1f"/><rect x="18" y="76" width="48" height="8" fill="#4d370e"/>
  </g>

  <g font-family="Tektur, Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="704" y="185" font-size="96" font-weight="700" letter-spacing="7" fill="#f4d35e" stroke="#b88920" stroke-width="3" paint-order="stroke" filter="url(#hardShadow)">ĐIỂM DANH</text>
    <rect x="296" y="219" width="816" height="4" fill="#72551a"/>
    <rect x="424" y="219" width="560" height="4" fill="#d7aa2e"/>
    <rect x="564" y="217" width="280" height="8" fill="#f4d35e"/>
    <text x="704" y="311" font-size="45" font-weight="700" letter-spacing="2" fill="#e5e0d2">ĐIỂM DANH SẼ NHẬN ĐƯỢC</text>
    <text x="704" y="379" font-size="45" font-weight="700" letter-spacing="2" fill="#e5e0d2">PHẦN THƯỞNG HẤP DẪN NHƯ <tspan fill="#f4d35e">XU,...</tspan></text>
  </g>

  <g fill="#b88920">
    <rect x="104" y="406" width="8" height="8"/><rect x="120" y="406" width="24" height="8"/><rect x="152" y="406" width="8" height="8"/>
    <rect x="1248" y="406" width="8" height="8"/><rect x="1264" y="406" width="24" height="8"/><rect x="1296" y="406" width="8" height="8"/>
  </g>
</svg>
