<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="512" viewBox="0 0 1408 512">
  <defs>
    <pattern id="coal" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#0c100c"/>
      <rect width="32" height="32" fill="#111711"/>
      <rect x="32" y="32" width="32" height="32" fill="#080c09"/>
      <path d="M0 32H64M32 0V32M16 32V64" stroke="#182119" stroke-width="2"/>
    </pattern>
    <pattern id="mossTicks" width="32" height="16" patternUnits="userSpaceOnUse">
      <rect y="7" width="4" height="2" fill="#375f18"/>
    </pattern>
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="135%">
      <feFlood flood-color="#50300d" result="c"/><feComposite in="c" in2="SourceAlpha" operator="in" result="s"/>
      <feOffset dx="6" dy="8" in="s" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1408" height="512" fill="#070907"/>
  <rect x="8" y="8" width="1392" height="496" fill="#333b31"/>
  <rect x="16" y="16" width="1376" height="480" fill="#121812"/>
  <rect x="24" y="24" width="1360" height="464" fill="#568d22"/>
  <rect x="30" y="30" width="1348" height="452" fill="#1e3214"/>
  <rect x="38" y="38" width="1332" height="436" fill="url(#coal)"/>
  <rect x="52" y="52" width="1304" height="408" fill="none" stroke="#263027" stroke-width="4"/>
  <rect x="58" y="58" width="1292" height="396" fill="url(#mossTicks)" opacity=".55"/>

  <!-- Góc bảng dùng xanh lá của MineRùa và vàng phần thưởng. -->
  <g fill="#83c82b">
    <path d="M38 38h58v8H54v50h-8V54h-8z"/><path d="M1370 38h-58v8h42v50h8V54h8z"/>
    <path d="M38 474h58v-8H54v-50h-8v42h-8z"/><path d="M1370 474h-58v-8h42v-50h8v42h8z"/>
  </g>
  <g fill="#f0c438">
    <rect x="66" y="66" width="10" height="10"/><rect x="1332" y="66" width="10" height="10"/>
    <rect x="66" y="436" width="10" height="10"/><rect x="1332" y="436" width="10" height="10"/>
  </g>

  <!-- Mascot Rùa đầu vuông, giản lược để giữ rõ hình khi chuyển sang map palette. -->
  <g transform="translate(90 104)">
    <rect x="16" y="40" width="126" height="104" rx="18" fill="#294f16"/>
    <rect x="26" y="30" width="112" height="98" rx="16" fill="#4e921d"/>
    <rect x="38" y="38" width="88" height="72" rx="12" fill="#70b929"/>
    <path d="M44 70h76M65 40l-8 70M98 40l10 70" fill="none" stroke="#376d18" stroke-width="8"/>
    <rect x="90" y="74" width="98" height="82" rx="14" fill="#78bd26"/>
    <rect x="98" y="66" width="90" height="82" rx="14" fill="#a7e332"/>
    <rect x="111" y="88" width="18" height="28" rx="8" fill="#111511"/><rect x="158" y="88" width="18" height="28" rx="8" fill="#111511"/>
    <rect x="116" y="91" width="5" height="7" fill="#f6f4d8"/><rect x="163" y="91" width="5" height="7" fill="#f6f4d8"/>
    <path d="M133 124h20M128 119v5M158 119v5" fill="none" stroke="#315718" stroke-width="4"/>
    <rect x="30" y="134" width="30" height="22" rx="6" fill="#79bd27"/><rect x="68" y="134" width="30" height="22" rx="6" fill="#79bd27"/>
    <rect x="15" y="100" width="26" height="20" rx="6" fill="#79bd27"/>
  </g>

  <!-- Đồng xu mai Rùa và kim cương liên kết nhận diện với phần thưởng. -->
  <g transform="translate(1190 112)">
    <rect x="24" y="0" width="64" height="8" fill="#9e701b"/><rect x="10" y="8" width="92" height="12" fill="#e1ae27"/>
    <rect x="0" y="20" width="112" height="84" fill="#e1ae27"/><rect x="10" y="28" width="92" height="68" fill="#f0c438"/>
    <path d="M56 34l29 17-11 33H38L27 51z" fill="#6fb52a" stroke="#356d1c" stroke-width="7"/>
    <path d="M56 34v50M27 51l47 33M85 51L38 84" fill="none" stroke="#a0dc35" stroke-width="5"/>
    <rect x="10" y="104" width="92" height="10" fill="#9e701b"/><rect x="24" y="114" width="64" height="8" fill="#50300d"/>
    <path d="M56 146l20 18-20 30-20-30z" fill="#77d9e8" stroke="#267f9b" stroke-width="5"/>
    <path d="M36 164h40M56 146v48" fill="none" stroke="#d9ffff" stroke-width="3"/>
  </g>

  <g font-family="Tektur, Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="735" y="178" font-size="91" font-weight="700" letter-spacing="6" fill="#f6d85b" stroke="#d59b1f" stroke-width="3" paint-order="stroke" filter="url(#goldShadow)">ĐIỂM DANH</text>
    <rect x="388" y="210" width="694" height="4" fill="#315718"/>
    <rect x="486" y="210" width="498" height="4" fill="#6aaa27"/>
    <rect x="616" y="208" width="238" height="8" fill="#a7e332"/>
    <text x="735" y="302" font-size="43" font-weight="700" letter-spacing="1.5" fill="#e7eadb">ĐIỂM DANH SẼ NHẬN ĐƯỢC</text>
    <text x="735" y="367" font-size="43" font-weight="700" letter-spacing="1.5" fill="#e7eadb">PHẦN THƯỞNG HẤP DẪN NHƯ <tspan fill="#f0c438">XU,...</tspan></text>
    <text x="735" y="424" font-size="21" font-weight="700" letter-spacing="7" fill="#78bd26">MINE RÙA • QUÀ MỖI NGÀY</text>
  </g>

  <g fill="#77d9e8">
    <path d="M116 350l7 12 12 7-12 7-7 12-7-12-12-7 12-7z"/>
    <path d="M1300 350l6 10 10 6-10 6-6 10-6-10-10-6 10-6z"/>
  </g>
</svg>
