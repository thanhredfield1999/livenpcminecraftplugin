<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="512" viewBox="0 0 1408 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142e20"/><stop offset=".46" stop-color="#244b2a"/><stop offset="1" stop-color="#0a1510"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="58%">
      <stop offset="0" stop-color="#ddf47a" stop-opacity=".42"/><stop offset=".46" stop-color="#75b63e" stop-opacity=".12"/><stop offset="1" stop-color="#07100b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7a1"/><stop offset=".22" stop-color="#ffe65a"/><stop offset=".57" stop-color="#ffc51e"/><stop offset="1" stop-color="#e47b08"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8c3d08"/><stop offset=".55" stop-color="#4b1e08"/><stop offset="1" stop-color="#a64d09"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d6ff55"/><stop offset=".5" stop-color="#8edb25"/><stop offset="1" stop-color="#459414"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#90df2e"/><stop offset=".48" stop-color="#429718"/><stop offset="1" stop-color="#1e5915"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#92551f"/><stop offset=".48" stop-color="#5f3015"/><stop offset="1" stop-color="#2a160d"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#eaffff"/><stop offset=".35" stop-color="#6feeff"/><stop offset="1" stop-color="#1597d2"/>
    </linearGradient>
    <pattern id="blocks" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M0 54V0h54" fill="none" stroke="#b7ef78" stroke-opacity=".045"/>
      <path d="M4 48h46V4" fill="none" stroke="#061008" stroke-opacity=".09"/>
    </pattern>
    <filter id="deepShadow" x="-25%" y="-35%" width="150%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/><feOffset dy="11" result="off"/>
      <feColorMatrix in="off" values="0 0 0 0 0.04 0 0 0 0 0.02 0 0 0 0 0 0 0 0 .85 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/><feOffset dx="0" dy="9" result="o"/>
      <feFlood flood-color="#170903" flood-opacity=".9" result="c"/><feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="islandClip"><path d="M205 408L292 338H1112L1202 408 1113 474H300z"/></clipPath>
  </defs>

  <rect width="1408" height="512" rx="22" fill="url(#sky)"/>
  <rect width="1408" height="512" rx="22" fill="url(#halo)"/>
  <rect width="1408" height="512" rx="22" fill="url(#blocks)"/>

  <!-- Ánh sáng nền và các tầng địa hình tạo chiều sâu như logo MineRùa. -->
  <ellipse cx="704" cy="473" rx="524" ry="30" fill="#020705" opacity=".65"/>
  <g filter="url(#deepShadow)">
    <path d="M205 408L292 338H1112L1202 408 1113 474H300z" fill="url(#earth)" stroke="#281208" stroke-width="8"/>
    <g clip-path="url(#islandClip)" opacity=".42" stroke="#c48134" stroke-width="3">
      <path d="M260 394h900M241 426h940M316 456h792M330 340v136M390 340v136M470 340v136M553 340v136M643 340v136M735 340v136M826 340v136M916 340v136M1000 340v136M1083 340v136"/>
    </g>
    <path d="M205 398L292 326H1112L1202 398 1113 429H300z" fill="#3d7f1f" stroke="#183a14" stroke-width="7"/>
    <path d="M217 390L299 335H1104L1190 390 1106 411H305z" fill="#79c52c"/>
    <path d="M245 376L316 341H1089L1162 376 1095 390H313z" fill="#a5e33b" opacity=".88"/>
  </g>

  <!-- Cây block hai phía, mang ngôn ngữ cảnh quan của logo gốc. -->
  <g filter="url(#deepShadow)">
    <g transform="translate(110 198)">
      <rect x="74" y="102" width="34" height="105" fill="#704018"/><rect x="83" y="102" width="14" height="105" fill="#a76624"/>
      <g fill="#4f991f" stroke="#256219" stroke-width="5">
        <rect x="34" y="52" width="114" height="72" rx="8"/><rect x="10" y="88" width="76" height="60" rx="8"/><rect x="96" y="82" width="76" height="68" rx="8"/>
      </g>
      <g fill="#80ca2a"><rect x="43" y="60" width="43" height="31"/><rect x="18" y="96" width="34" height="26"/><rect x="105" y="91" width="38" height="28"/></g>
    </g>
    <g transform="translate(1134 198)">
      <rect x="74" y="102" width="34" height="105" fill="#704018"/><rect x="83" y="102" width="14" height="105" fill="#a76624"/>
      <g fill="#4f991f" stroke="#256219" stroke-width="5">
        <rect x="34" y="52" width="114" height="72" rx="8"/><rect x="10" y="88" width="76" height="60" rx="8"/><rect x="96" y="82" width="76" height="68" rx="8"/>
      </g>
      <g fill="#80ca2a"><rect x="43" y="60" width="43" height="31"/><rect x="18" y="96" width="34" height="26"/><rect x="105" y="91" width="38" height="28"/></g>
    </g>
  </g>

  <!-- Mascot Rùa trung tâm: thân thiện, bóng khối rõ, gần logo nhưng tối ưu cho banner ngang. -->
  <g transform="translate(532 20)" filter="url(#deepShadow)">
    <ellipse cx="166" cy="164" rx="139" ry="27" fill="#08120a" opacity=".55"/>
    <path d="M25 121C27 55 82 18 166 22c72 3 117 43 119 102z" fill="url(#shell)" stroke="#173c0d" stroke-width="8"/>
    <path d="M54 83c22-34 59-50 105-49l-12 43-43 26zm107-49c43 2 76 20 94 48l-49 19-47-24zM48 94l53 17 39 42H49c-16-14-18-39-1-59zm60 14l45-24 47 25-16 48h-38zm98 1l54-17c18 19 17 45 0 62h-68z" fill="none" stroke="#2a6b15" stroke-width="7"/>
    <path d="M46 123c35 19 163 24 225-2l-5 35c-57 28-174 25-222 2z" fill="#65ad22" stroke="#234e13" stroke-width="7"/>
    <rect x="235" y="74" width="118" height="102" rx="26" fill="url(#lime)" stroke="#315c11" stroke-width="8"/>
    <path d="M247 86c16-12 67-16 93-1" fill="none" stroke="#e0ff73" stroke-width="7" opacity=".8"/>
    <rect x="257" y="105" width="23" height="36" rx="11" fill="#101610"/><rect x="315" y="105" width="23" height="36" rx="11" fill="#101610"/>
    <circle cx="272" cy="113" r="5" fill="white"/><circle cx="330" cy="113" r="5" fill="white"/>
    <path d="M286 148c12 12 27 12 39 0" fill="none" stroke="#315c11" stroke-width="5" stroke-linecap="round"/>
    <path d="M80 152l-29 33h55l20-28M218 157l17 29h50l-29-39" fill="#83cc2c" stroke="#254e14" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- Khung chữ gỗ giúp vàng nổi mà vẫn giữ chất Minecraft. -->
  <g filter="url(#deepShadow)">
    <path d="M287 190L335 166H1073L1121 190 1091 330H317z" fill="#351808" stroke="#1d0b04" stroke-width="9"/>
    <path d="M307 197L346 180H1062L1101 197 1076 313H332z" fill="#603016" stroke="#a65a1d" stroke-width="5"/>
    <path d="M327 207H1080L1063 300H344z" fill="#281408" opacity=".82"/>
    <path d="M350 217h690" stroke="#c17427" stroke-width="4" opacity=".45"/>
  </g>

  <g font-family="Tektur, Impact, sans-serif" text-anchor="middle" filter="url(#textShadow)">
    <text x="704" y="291" font-size="103" font-weight="700" letter-spacing="4" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="11" paint-order="stroke">ĐIỂM DANH</text>
    <text x="704" y="286" font-size="103" font-weight="700" letter-spacing="4" fill="none" stroke="#fff4a0" stroke-width="2" opacity=".8">ĐIỂM DANH</text>
  </g>

  <g font-family="Work Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="400" y="334" width="608" height="62" rx="15" fill="#07110b" opacity=".9" stroke="#609f29" stroke-width="3"/>
    <text x="704" y="361" font-size="23" font-weight="700" letter-spacing="1.2" fill="#f4f1d9">ĐIỂM DANH ĐỂ NHẬN PHẦN THƯỞNG</text>
    <text x="704" y="385" font-size="16" font-weight="700" letter-spacing="4" fill="#b7ec53">XU  •  KIM CƯƠNG  •  QUÀ HẤP DẪN</text>
  </g>

  <!-- Vật phẩm phần thưởng tạo nhịp thị giác quanh chân đảo. -->
  <g filter="url(#softGlow)">
    <g transform="translate(226 333)"><circle cx="0" cy="0" r="28" fill="url(#gold)" stroke="#a95708" stroke-width="6"/><circle r="15" fill="none" stroke="#fff287" stroke-width="4"/><path d="M-5-12h10v24H-5z" fill="#d98a0b"/></g>
    <g transform="translate(1167 339)"><circle cx="0" cy="0" r="25" fill="url(#gold)" stroke="#a95708" stroke-width="6"/><circle r="13" fill="none" stroke="#fff287" stroke-width="4"/></g>
    <g transform="translate(1090 370)"><path d="M0-39l34 19-13 48h-42l-13-48z" fill="url(#diamond)" stroke="#176c9b" stroke-width="6"/><path d="M-34-20h68M0-39v67M-34-20L0 28 34-20" fill="none" stroke="#d8ffff" stroke-width="3"/></g>
    <path d="M194 112l8 17 17 8-17 8-8 17-8-17-17-8 17-8zM1208 97l7 14 14 7-14 7-7 14-7-14-14-7 14-7z" fill="#ffe85a"/>
    <path d="M251 80l5 10 10 5-10 5-5 10-5-10-10-5 10-5zM1155 152l6 12 12 6-12 6-6 12-6-12-12-6 12-6z" fill="#5eeaff"/>
  </g>

  <rect x="10" y="10" width="1388" height="492" rx="17" fill="none" stroke="#9de143" stroke-width="4" opacity=".65"/>
  <rect x="20" y="20" width="1368" height="472" rx="12" fill="none" stroke="#f2ca3d" stroke-width="2" opacity=".45"/>
</svg>
