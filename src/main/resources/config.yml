# Durable config schema. Older versions migrate additively; future versions fail closed.
config-version: 1
tick-interval: 10
runtime:
  # Emergency kill switch. Disabling this keeps NPC data and admin commands available but stops all runtime ticks.
  enabled: true
telemetry:
  # Economy and visitor payloads are separate bounded opt-ins. They are omitted unless enabled.
  economy:
    enabled: false
  visitors:
    enabled: false
  export:
    # Opt-in BotChecker/Pixel Map snapshot export. Disabled by default; /lnpc telemetry json remains available.
    enabled: false
    # Relative to plugins/LivingNPC. Must stay inside the data folder and name a .json file.
    file: telemetry/latest.json
    # Main thread captures immutable bounded JSON; async worker writes it with same-directory atomic replace when supported.
    interval-ticks: 100
bluemap:
  markers:
    # Opt-in BlueMap marker export. Disabled by default; requires BlueMap to be installed and ready.
    enabled: false
    # Main-thread update interval. BlueMap API is optional and fail-closed when world/map is not mapped.
    interval-ticks: 100
    # Remove NPC markers when latest telemetry is older than this tick age.
    stale-ticks: 600
# Chỉ dùng cho hành vi tương tác/diagnostic; không gate runtime task đã cấu hình hợp lệ.
activation-range: 48.0
work-start-tick: 1000
work-end-tick: 12000
work-scan-interval-ticks: 100
farmer:
  daily-plan:
    enabled: true
    lunch-duration-ticks: 1000
action-delay-min-ticks: 20
action-delay-max-ticks: 60
inspection-duration-ticks: 12
danger-range: 10.0
protection:
  require-worldguard: true
economy:
  currency-name: Xu đồng
  unlimited-storage: true
  inventory-capacity: 512
  output-per-action: 1
  max-output-per-shift: 32
  sell-at-shift-end: true
gemini:
  enabled: false
  model: gemini-2.5-flash-lite
  global-requests-per-minute: 10
  per-npc-cooldown-seconds: 300
  monthly-budget-usd: 0.0
  allowed-intents: [WORK, REST, VISIT_MARKET, SOCIALIZE]
navigation-timeout-ticks: 400
max-plot-radius: 8
ambient:
  interval-min-ticks: 100
  interval-max-ticks: 240
  duration-min-ticks: 30
  duration-max-ticks: 80
  player-notice-range: 7.0
  wander-radius: 3
resident:
  patrol:
    enabled: true
    scan-interval-ticks: 600
    scan-radius: 32
    vertical-range: 4
    max-cached-paths: 512
    scan-blocks-per-tick: 256
    min-target-distance: 8
    max-target-distance: 24
    trip-cooldown-min-ticks: 160
    trip-cooldown-max-ticks: 360
seating:
  enabled: true
  rest-duration-min-ticks: 600
  rest-duration-max-ticks: 1200
  stand-duration-ticks: 8
needs:
  # Season 7 foundation. Keep disabled until food/water behavior and transaction replay are enabled.
  enabled: false
  hunger-decay-ticks-per-point: 1200
  thirst-decay-ticks-per-point: 800
  max-managed-delta-ticks: 1200
  save-interval-ticks: 1200
season-8:
  # Foundation only. No Cook runtime or physical furnace inventory is enabled yet.
  enabled: false
  max-batch: 4
navigation:
  speed-modifier: 0.85
  distance-margin: 1.5
  retry-backoff-ticks: 60
work-zones:
  validation-radius: 6
  validation-vertical-range: 3
visitors:
  enabled: false
  max-active: 3
  spawn-interval-min-ticks: 1200
  spawn-interval-max-ticks: 2400
  wallet-min-minor: 300
  wallet-max-minor: 1500
  max-purchase-items: 3
  stock-reserves:
    wheat: 8
    wheat_seeds: 8
    carrot: 8
  shopping-duration-ticks: 120
  lifetime-ticks: 2400
  activation-range: 64.0
season-5:
  # Experimental until the market economy and transaction journal pass a live soak test.
  enabled: false
  market-day:
    interval-days: 7
    day-offset: 0
    start-tick: 1000
    end-tick: 12000
  caravan:
    follower-min: 1
    follower-max: 2
    pack-animal-chance: 0.5
    formation-spacing: 2.0
season-9:
  # Foundation only. Real cooking remains disabled until Seasons 6-8 are implemented and smoke-tested.
  enabled: false
season-6:
  # Foundation only. Enable after activity points and navigation leases pass live smoke tests.
  enabled: false
  morning-exit-timeout-ticks: 600
season-10:
  # Foundation only. Keep disabled until Seasons 6-9 provide needs, kitchen and cooking journals.
  enabled: false
  meals:
    breakfast:
      start-tick: 500
      end-tick: 2500
    lunch:
      start-tick: 5500
      end-tick: 7500
    dinner:
      start-tick: 10500
      end-tick: 12500
  serving:
    demand-buffer: 2
    max-batch-size: 8
    visitor-quota-per-batch: 0
  fallback-stored-food: true
season-11:
  # Foundation only. Economic seasons do not affect stock or labor until Season 10 is complete.
  enabled: false
  days-per-season: 7
  start-day: 0
  modifiers:
    spring:
      stock-target-percent: 100
      export-demand-percent: 90
      labor-priority-percent: 110
    summer:
      stock-target-percent: 100
      export-demand-percent: 100
      labor-priority-percent: 100
    autumn:
      stock-target-percent: 120
      export-demand-percent: 110
      labor-priority-percent: 110
    winter:
      stock-target-percent: 150
      export-demand-percent: 80
      labor-priority-percent: 120
rancher:
  scan-interval-ticks: 200
  action-cooldown-ticks: 600
  love-mode-ticks: 600
  max-cull-per-cycle: 2
  interaction-range: 4.0
  escape-search-radius: 12
  patrol-interval-ticks: 240
fisher:
  attempt-delay-min-ticks: 500
  attempt-delay-max-ticks: 900
  success-chance: 0.70
  max-catch-per-shift: 12
  water-search-radius: 4
  water-search-vertical-range: 2
miner:
  scan-interval-ticks: 200
  break-delay-ticks: 120
  swing-interval-ticks: 10
  restoration-delay-seconds: 1800
  batch-size: 4
