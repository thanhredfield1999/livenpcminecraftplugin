name: LivingNPC
version: '${version}'
main: vn.heomc.livingnpc.LivingNpcPlugin
api-version: '1.21'
depend: [Citizens]
softdepend: [WorldGuard]
authors: [HeoMC]
description: Cư dân làng sinh hoạt theo lịch, sử dụng Citizens.
commands:
  livingnpc:
    description: Quản lý các cư dân LivingNPC.
    usage: /livingnpc help [1-3] | /livingnpc list
    aliases: [lnpc]
    permission: livingnpc.admin
permissions:
  livingnpc.admin:
    description: Cho phép quản lý cư dân LivingNPC.
    default: op
